spring.application.name=bookmyshow-backend

spring.datasource.url=jdbc:mysql://localhost:3306/bookmyshow_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

# TMDB (The Movie Database) Worldwide API Configuration
# Replace with a custom TMDB API key if desired; fallback catalog is active by default
tmdb.api.key=YOUR_TMDB_API_KEY
tmdb.api.base-url=https://api.themoviedb.org/3
